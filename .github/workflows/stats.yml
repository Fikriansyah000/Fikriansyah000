name: Generate Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate top languages SVG
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: Fikriansyah000
        run: |
          mkdir -p dist
          python3 <<'PY'
import html
import json
import os
import urllib.request

owner = os.environ["GITHUB_REPOSITORY_OWNER"]
token = os.environ.get("GITHUB_TOKEN", "")

headers = {
    "Accept": "application/vnd.github+json",
    "User-Agent": "github-readme-stats-fallback",
}

if token:
    headers["Authorization"] = f"Bearer {token}"


def request(url: str):
    req = urllib.request.Request(url, headers=headers)
    with urllib.request.urlopen(req) as response:
        return json.load(response)


def safe_escape(value: str) -> str:
    return html.escape(value, quote=True)


repos = request(
    f"https://api.github.com/users/{owner}/repos?per_page=100&type=owner&sort=updated&direction=desc"
)

language_bytes = {}
public_repo_count = 0

for repo in repos:
    if repo.get("archived") or repo.get("fork"):
        continue

    public_repo_count += 1
    languages = request(repo["languages_url"])
    for language, count in languages.items():
        language_bytes[language] = language_bytes.get(language, 0) + int(count)

if not language_bytes:
    language_bytes = {"No data": 1}

top_languages = sorted(language_bytes.items(), key=lambda item: item[1], reverse=True)[:3]
total_bytes = sum(language_bytes.values())
card_width = 410
card_height = 175
row_height = 24
start_y = 86
bar_left = 24
bar_width = 362
bar_height = 8

rows = []
for index, (language, count) in enumerate(top_languages):
    y = start_y + index * row_height
    percent = (count / total_bytes) * 100 if total_bytes else 0
    filled_width = max(8, int(bar_width * (count / total_bytes))) if total_bytes else 8
    rows.append(
        f'''<g>
  <text x="24" y="{y}" fill="#DDE8FF" font-size="14" font-weight="600">{safe_escape(language)}</text>
  <text x="386" y="{y}" fill="#7EA0D6" font-size="12" text-anchor="end">{percent:.1f}%</text>
  <rect x="24" y="{y + 8}" width="362" height="8" rx="4" fill="#111A2E"/>
  <rect x="24" y="{y + 8}" width="{filled_width}" height="8" rx="4" fill="#00D2FF"/>
</g>'''
    )

svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{card_width}" height="{card_height}" viewBox="0 0 {card_width} {card_height}" role="img" aria-labelledby="title desc">
  <title id="title">Top languages</title>
  <desc id="desc">Self-hosted summary of the profile's most used languages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#101B33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#6EA8FF"/>
    </linearGradient>
  </defs>
  <rect width="{card_width}" height="{card_height}" rx="14" fill="url(#bg)" stroke="#00D2FF" stroke-opacity="0.35"/>
  <text x="24" y="30" fill="#8FB5FF" font-size="12" letter-spacing="2.6">TELEMETRY / STATS</text>
  <text x="24" y="52" fill="#FFFFFF" font-size="18" font-weight="700">Top Languages</text>
  <text x="24" y="70" fill="#7EA0D6" font-size="12">{public_repo_count} public repos · {total_bytes:,} bytes of code</text>
  {''.join(rows)}
  <rect x="24" y="154" width="362" height="2" rx="1" fill="url(#accent)" opacity="0.7"/>
</svg>'''

with open("dist/top-langs.svg", "w", encoding="utf-8") as handle:
    handle.write(svg)
PY

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}