  <path d="M 788,28 L 788,12 L 772,12" stroke="#00D2FF" stroke-width="2.5" fill="none" />
  <path d="M 12,172 L 12,188 L 28,188" stroke="#00D2FF" stroke-width="2.5" fill="none" />
  <path d="M 788,172 L 788,188 L 772,188" stroke="#00D2FF" stroke-width="2.5" fill="none" />
  
  <!-- Content -->
