<svg xmlns="http://www.w3.org/2000/svg" width="410" height="175" viewBox="0 0 410 175" role="img" aria-labelledby="title desc">
  <title id="title">Telemetry stats fallback</title>
  <desc id="desc">A local fallback card for the stats section.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#101B33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#6EA8FF"/>
    </linearGradient>
  </defs>
  <rect width="410" height="175" rx="14" fill="url(#bg)" stroke="#00D2FF" stroke-opacity="0.35"/>
  <text x="24" y="30" fill="#8FB5FF" font-family="Orbitron, monospace" font-size="12" letter-spacing="2.5">TELEMETRY / STATS</text>
  <text x="24" y="54" fill="#FFFFFF" font-family="Orbitron, monospace" font-size="18" font-weight="700">Local Fallback</text>
  <text x="24" y="74" fill="#7EA0D6" font-family="Orbitron, monospace" font-size="12">No external API required</text>

  <g>
    <text x="24" y="104" fill="#DDE8FF" font-family="Orbitron, monospace" font-size="13" font-weight="600">Markdown</text>
    <text x="386" y="104" fill="#7EA0D6" font-family="Orbitron, monospace" font-size="12" text-anchor="end">74%</text>
    <rect x="24" y="112" width="362" height="8" rx="4" fill="#111A2E"/>
    <rect x="24" y="112" width="268" height="8" rx="4" fill="#00D2FF"/>
  </g>

  <g>
    <text x="24" y="129" fill="#DDE8FF" font-family="Orbitron, monospace" font-size="13" font-weight="600">YAML</text>
    <text x="386" y="129" fill="#7EA0D6" font-family="Orbitron, monospace" font-size="12" text-anchor="end">20%</text>
    <rect x="24" y="137" width="362" height="8" rx="4" fill="#111A2E"/>
    <rect x="24" y="137" width="72" height="8" rx="4" fill="#6EA8FF"/>
  </g>

  <g>
    <text x="24" y="154" fill="#DDE8FF" font-family="Orbitron, monospace" font-size="13" font-weight="600">Shell</text>
    <text x="386" y="154" fill="#7EA0D6" font-family="Orbitron, monospace" font-size="12" text-anchor="end">6%</text>
    <rect x="24" y="162" width="362" height="8" rx="4" fill="#111A2E"/>
    <rect x="24" y="162" width="22" height="8" rx="4" fill="#00B6D6"/>
  </g>

  <rect x="24" y="154" width="362" height="2" rx="1" fill="url(#accent)" opacity="0.7"/>
</svg>